name: Deploy SBOMs to DependencyTrack for Multiple Repositories

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  actions: write

env:
  DEPENDENCYTRACK_SERVER: 'api.dependencytrack.open-elements.cloud'

jobs:
  build-and-deploy-sbom:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        repo: ${{ fromJson(needs.setup.outputs.repos) }}

    needs: setup

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo.url }}
          path: ${{ matrix.repo.name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: ${{ matrix.repo.name }}
        run: mvn org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom --debug

      - name: Check SBOM Existence
        working-directory: ${{ matrix.repo.name }}
        run: |
          if [ ! -f target/bom.xml ]; then
            echo "Error: SBOM file (target/bom.xml) not found!"
            exit 1
          fi

      - name: Deploy SBOM to DependencyTrack
        uses: DependencyTrack/gh-upload-sbom@v3
        with:
          serverHostname: ${{ env.DEPENDENCYTRACK_SERVER }}
          apiKey: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
          projectName: ${{ matrix.repo.name }}
          projectVersion: 'main'
          bomFilename: "${{ matrix.repo.name }}/target/bom.xml"
          autoCreate: true

  setup:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.set-repos.outputs.repos }}
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4

      - name: Read repos.json
        id: set-repos
        run: |
          echo "repos=$(cat repos.json)" >> $GITHUB_OUTPUT
